{% extends "base.html" %}
{% block title %}Vulnerability Log{% endblock %}

{% block content %}
<section class="panel narrow">
    <h1>Vulnerability Log</h1>

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('index') }}">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. SQL Injection in login" required>

        <label for="category">OWASP Category</label>
        <select id="category" name="category">
            {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label for="severity">Severity</label>
        <select id="severity" name="severity">
            {% for s in severities %}
            <option value="{{ s }}" {{ 'selected' if s == 'High' }}>{{ s }}</option>
            {% endfor %}
        </select>

        <button type="submit">Report vulnerability</button>
    </form>
</section>
{% endblock %}
